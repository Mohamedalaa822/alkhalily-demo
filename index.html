<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alkhalily Market Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/*
  VOICE: calm, businesslike Arabic SaaS — decisions first, numbers clean.
  IDEA: a pricing desk ledger — every product row is a price decision.
  PICTURE: the comparison tables and price-history charts are the picture.
  COLOUR/TYPE: white panels on soft gray, orange #F26B1D accent; system Arabic sans.
  LAYOUT: compact right sidebar (RTL), sticky top bar, card grid, wide tables.
*/
:root{
  --orange:#F26B1D; --orange-600:#D9560C; --orange-50:#FFF5EE; --orange-100:#FFE6D5;
  --bg:#F4F5F7; --panel:#FFFFFF; --line:#E7E9EE; --line-2:#F0F1F4;
  --ink:#1D2230; --ink-2:#424A5B; --muted:#6B7385; --faint:#9AA1AF;
  --green:#15803D; --green-50:#ECFDF3; --red:#C62828; --red-50:#FEF1F1;
  --amber:#B45309; --amber-50:#FFF7E6; --blue:#1D4ED8; --blue-50:#EEF3FF;
  --gray-50:#F6F7F9;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.6 "IBM Plex Sans Arabic","Segoe UI","Noto Sans Arabic","Tahoma","Geeza Pro","DejaVu Sans",Arial,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mono{white-space:nowrap;font-family:ui-monospace,"SFMono-Regular",Consolas,"DejaVu Sans Mono",monospace;font-size:12.5px;letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.nowrap{white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--panel);border-inline-start:0;border-inline-end:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--line-2);margin-bottom:12px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.brand-name{font-weight:700;font-size:15px;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:start;min-height:42px}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor}
.nav button:hover{background:var(--gray-50)}
.nav button.active{background:var(--orange-50);color:var(--orange-600);font-weight:700}
.nav .count{margin-inline-start:auto;background:var(--orange);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-weight:700}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:10px 8px;border-top:1px solid var(--line-2)}
.side-foot button{border:0;background:none;color:var(--muted);padding:0;cursor:pointer;text-decoration:underline;font-size:11.5px}

.main{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
.topbar h1{font-size:19px;margin:0;font-weight:700}
.topbar .spacer{flex:1}
.demo-badge{background:var(--amber-50);color:var(--amber);border:1px solid #F7DDB0;border-radius:99px;font-size:11.5px;padding:2px 10px;font-weight:600;white-space:nowrap}
.sync-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;background:var(--gray-50);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.content{padding:22px 24px 48px;max-width:1440px;width:100%}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;min-height:38px;white-space:nowrap;color:var(--ink-2);transition:background .15s,border-color .15s}
.btn:hover{background:var(--gray-50);border-color:#D9DCE3}
.btn:focus-visible,.nav button:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.btn svg{width:16px;height:16px;stroke:currentColor;flex:none}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-600);border-color:var(--orange-600)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--gray-50)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12.5px;border-radius:8px}
.btn.ok{color:var(--green);border-color:#BFE6CC;background:var(--green-50)}
.btn.no{color:var(--red);border-color:#F4C7C7;background:var(--red-50)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.card-h .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack-v>*+*{margin-top:16px}
.input,.select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;min-height:38px;font-size:14px;width:100%}
.input:focus,.select:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px var(--orange-100)}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint)}
.search .input{padding-inline-start:34px}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field{margin-bottom:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar>.search{flex:1 1 260px}
.toolbar>.select{width:auto;min-width:150px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap;border:1px solid transparent;line-height:1.6}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.badge.plain::before{display:none}
.b-green{background:var(--green-50);color:var(--green);border-color:#C8EBD4}
.b-red{background:var(--red-50);color:var(--red);border-color:#F6CFCF}
.b-amber{background:var(--amber-50);color:var(--amber);border-color:#F6DFB5}
.b-blue{background:var(--blue-50);color:var(--blue);border-color:#D3DEFB}
.b-gray{background:var(--gray-50);color:var(--muted);border-color:var(--line)}
.b-orange{background:var(--orange-50);color:var(--orange-600);border-color:var(--orange-100)}

/* KPI */
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:#D9DCE3}
.kpi .k-label{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .k-dot{width:8px;height:8px;border-radius:50%}
.kpi .k-val{font-size:26px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .k-foot{font-size:12px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:10px 12px;background:var(--gray-50);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FCFCFD}
.tbl tr.sel td{background:var(--orange-50)}
.tbl tr.sel:hover td{background:#FFEFE3}
.tbl tr.excl td{opacity:.55}
.tbl td.n,.tbl th.n{text-align:end}
.tbl.compact td,.tbl.compact th{padding:9px 9px}.tbl.compact{font-size:13px}.tbl.compact .p-cell{min-width:150px}
.tbl .clickable{cursor:pointer}
.p-cell{display:flex;align-items:center;gap:10px;min-width:170px}
.p-cell .p-name{font-weight:600;line-height:1.35}
.p-cell .p-sub{font-size:12px;color:var(--muted)}
.thumb{width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;color:var(--tc);background:radial-gradient(120% 120% at 25% 15%,#fff 0,color-mix(in srgb,var(--tc) 10%,#fff) 70%);border:1px solid color-mix(in srgb,var(--tc) 18%,#fff)}
.thumb svg{width:30px;height:30px}
.thumb .f{fill:currentColor;fill-opacity:.17}
.thumb.lg{width:96px;height:96px;border-radius:18px}
.thumb.lg svg{width:66px;height:66px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--orange);cursor:pointer;margin:0;vertical-align:middle}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:32px;white-space:nowrap;color:var(--ink-2)}
.chip:hover{border-color:#D3D7DF}
.chip .c-n{font-size:11.5px;color:var(--faint)}
.chip.inc{background:var(--orange-50);border-color:var(--orange);color:var(--orange-600);font-weight:600}
.chip.inc::before{content:"✓";font-weight:800}
.chip.exc{background:var(--red-50);border-color:#EFB3B3;color:var(--red);text-decoration:line-through}
.chip.exc::before{content:"−";font-weight:800;text-decoration:none;display:inline-block}
.chip.filter.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.filter.on .c-n{color:#C9CDD6}
.chip .x{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:inherit;font-size:14px;line-height:1}
.sel-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0}
.sel-row+.sel-row{border-top:1px dashed var(--line)}
.sel-row .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);padding-top:6px}
.selbar{position:sticky;bottom:12px;z-index:15;margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(16,24,40,.18)}
.selbar .big{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.selbar .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.selbar .btn:hover{background:rgba(255,255,255,.16)}
.selbar .btn.primary{background:var(--orange);border-color:var(--orange)}
.selbar .meta{font-size:12.5px;color:#C9CDD6}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.li .ic svg{width:16px;height:16px}
.li .t{font-size:13.5px;line-height:1.45}
.li .m{font-size:12px;color:var(--muted)}
.li .act{margin-inline-start:auto;display:flex;gap:4px;align-items:center}
.li.click{cursor:pointer}
.li.click:hover .t{color:var(--orange-600)}
.icon-btn{border:0;background:none;color:var(--faint);cursor:pointer;width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.icon-btn:hover{background:var(--gray-50);color:var(--ink)}

/* charts */
.fig{position:relative;direction:ltr}
.fig svg{display:block;width:100%;height:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);direction:rtl;z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;padding:6px 0;cursor:pointer}
.bar-row:hover .bar-l{color:var(--orange-600)}
.bar-track{background:var(--gray-50);border-radius:6px;height:12px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}

/* stat boxes inside detail */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--gray-50);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.stat .s-l{font-size:12px;color:var(--muted);font-weight:600}
.stat .s-v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .s-f{font-size:11.5px;color:var(--muted)}
.stat.hl{background:var(--orange-50);border-color:var(--orange-100)}
.stat.hl .s-v{color:var(--orange-600)}
.reco{border:1px solid var(--orange-100);background:linear-gradient(180deg,#FFF8F3,#fff);border-radius:12px;padding:16px}
.reco h4{margin:0 0 10px;font-size:14.5px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.note svg{width:17px;height:17px;flex:none;margin-top:1px}
.note.warn{background:var(--amber-50);color:#7A3E06;border:1px solid #F6DFB5}
.note.info{background:var(--blue-50);color:#1E3A8A;border:1px solid #D3DEFB}
.note.danger{background:var(--red-50);color:#8A1C1C;border:1px solid #F6CFCF}
.note.lock{background:var(--gray-50);color:var(--ink-2);border:1px solid var(--line)}
.signals{display:flex;flex-wrap:wrap;gap:4px}
.tbl .signals{min-width:150px;max-width:210px}
.sig{font-size:11.5px;border-radius:6px;padding:1px 7px;white-space:nowrap;border:1px solid}
.sig.y{color:var(--green);background:var(--green-50);border-color:#C8EBD4}
.sig.n{color:var(--red);background:var(--red-50);border-color:#F6CFCF}
.sig.u{color:var(--muted);background:var(--gray-50);border-color:var(--line)}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px 10px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--orange-600);border-bottom-color:var(--orange)}
.tabs .tc{background:var(--gray-50);border-radius:99px;font-size:11px;padding:0 7px;margin-inline-start:5px;color:var(--muted)}
.tabs button.on .tc{background:var(--orange-100);color:var(--orange-600)}
.comp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.comp{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.comp .c-top{display:flex;align-items:center;gap:10px}
.comp .c-av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.comp .c-name{font-weight:700}
.comp .c-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.comp .c-row b{color:var(--ink);font-variant-numeric:tabular-nums}
.comp.add{border-style:dashed;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);min-height:150px;background:transparent;box-shadow:none}
.comp.add:hover{border-color:var(--orange);color:var(--orange-600)}
.cand{border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.cand+.cand{margin-top:10px}
.cand.approved{border-color:#BFE6CC;background:#FAFEFB}
.cand.rejected{opacity:.6;background:var(--gray-50)}
.cand .c-t{font-weight:600}
.cand .c-m{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.cand .c-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pick-list{border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;margin-top:6px}
.pick-list button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:#fff;padding:8px 10px;cursor:pointer;text-align:start;border-bottom:1px solid var(--line-2)}
.pick-list button:hover{background:var(--orange-50)}
.banner{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #F6DFB5;border-inline-start:4px solid var(--orange);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--ink-2)}
.banner .icon-btn{margin-inline-start:auto}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(17,22,33,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .15s ease}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.modal.wide{max-width:1040px}
.modal-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal-h h3{margin:0;font-size:16.5px}
.modal-h .icon-btn{margin-inline-start:auto}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);background:#FCFCFD;border-radius:0 0 14px 14px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--faint);font-size:13.5px}
.steps li .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px}
.steps li.run{color:var(--ink)} .steps li.run .st{border-color:var(--orange);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink-2)} .steps li.done .st{background:var(--green);border-color:var(--green);color:#fff}
.progress{height:6px;background:var(--gray-50);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}
.spin{width:18px;height:18px;border:2px solid var(--orange-100);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast */
.toasts{position:fixed;top:70px;left:18px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:13.5px;box-shadow:0 8px 24px rgba(16,24,40,.25);animation:fade .2s ease;display:flex;gap:8px;align-items:flex-start}

<body>
<div id="nojs" style="max-width:560px;margin:60px auto;padding:28px;border:1px solid #FFE6D5;border-radius:16px;background:#FFF8F3;font:16px/1.8 Tahoma,Arial,sans-serif;color:#1D2230;text-align:center">

  <b style="font-size:20px">Alkhalily Market Intelligence</b><br>
  هذه نسخة عرض تفاعلية وتحتاج فتحها في متصفح.<br>
  افتح الملف من الكمبيوتر في Chrome أو Edge أو Safari، أو استخدم رابط العرض.

<script>
{
// ---- util.js ----
// ===================== util.js =====================
// Small helpers shared by every module. No dependencies.
const DAY = 864e5, HOUR = 36e5;
const delay = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const egp = n => n == null || isNaN(n) ? '—' : `<span class="num">${fmt(n)} ج.م</span>`;
const egpTxt = n => n == null || isNaN(n) ? '—' : `${fmt(n)} ج.م`;
const pct = (n, d = 1) => n == null || isNaN(n) ? '—' : `<span class="num ltr">${n > 0 ? '+' : ''}${fmt(n, d)}%</span>`;
const pctPlain = (n, d = 1) => n == null || isNaN(n) ? '—' : `<span class="num">${fmt(n, d)}%</span>`;
// Arabic number–noun agreement: cnt(1,'product') → "منتج واحد", 2 → "منتجين", 5 → "5 منتجات", 24 → "24 منتجًا"
const NOUNS = {
  product: ['منتج واحد', 'منتجين', 'منتجات', 'منتجًا'],
  price: ['سعر واحد', 'سعرين', 'أسعار', 'سعرًا'],

  sheet: ['ورقة واحدة', 'ورقتين', 'أوراق', 'ورقة'],
  result: ['نتيجة واحدة', 'نتيجتين', 'نتائج', 'نتيجة'],

  competitorPl: ['منافس واحد', 'منافسَين', 'منافسين', 'منافسًا'],
};
const cnt = (n, k) => {
  const f = NOUNS[k]; n = Math.round(n);
  if (n === 1) return f[0];
  if (n === 2) return f[1];
  const r = n % 100; // Arabic agreement follows the last two digits
  return `${fmt(n)} ${n === 0 || (r >= 3 && r <= 10) ? f[2] : r >= 11 ? f[3] : f[3].replace(/ًا$/, '')}`;
};
// percentage wrapped in bidi isolates so it reads correctly inside Arabic plain text
const isoPct = (n, d = 1) => '\u2066' + fmt(n, d) + '%\u2069';
const sum = a => a.reduce((s, x) => s + x, 0);
const avg = a => a.length ? sum(a) / a.length : null;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9);
function hashStr(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function fmtDateTime(d) { if (!d) return '—'; d = new Date(d); return `${fmtDate(d)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function relTime(d) {
  if (!d) return 'لم يتم بعد';
  const diff = Date.now() - new Date(d).getTime();
  if (diff < 60e3) return 'الآن';
  const ar = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? `${n} ${few}` : `${n} ${many}`;
  const m = Math.round(diff / 60e3); if (m < 60) return 'منذ ' + ar(m, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة');

  const dd = Math.round(diff / DAY); return 'منذ ' + ar(dd, 'يوم', 'يومين', 'أيام', 'يومًا');
}
const normalize = s => String(s || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\s\-_/]+/g, '');

// Build all mock records relative to "now" so dates always look fresh.
function buildMockDb() {
  const now = Date.now();
  const products = RAW_PRODUCTS.map(buildProduct);
  const competitors = COMPETITOR_SEED.map(c => ({ ...c, addedAt: now - 120 * DAY, lastMonitor: now - (2 + hashStr(c.id) % 5) * HOUR }));
  const matches = [];
  const ourHistory = {};
  const W = 8;

  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const mkHistory = (r, final, inStock, last, forceDrop) => {
    const start = round5(final * (1 + (r() - 0.45) * 0.10));
    const pts = [];
    for (let w = 0; w < W; w++) {
      const t = last - (W - 1 - w) * 7 * DAY;
      let p;
      if (w === W - 1) p = final;
      else if (w === W - 2) p = forceDrop ? round5(final * 1.06) : (r() < 0.25 ? round5(final * (1 + (r() - 0.5) * 0.10)) : final);
      else p = round5(start + (final - start) * (w / (W - 1)) + (r() - 0.5) * final * 0.02);
      pts.push({ t, price: p, inStock: w === W - 1 ? inStock : true });
    }
    return pts;
  };
  const sigAll = { model: 'y', sku: 'u', brand: 'y', specs: 'y', pkg: 'y' };

  products.forEach((p, i) => {
    const r = rng('prod-' + p.id);
    // Alkhalily's own price history (some products were reduced 4 weeks ago)
    ourHistory[p.id] = Array.from({ length: W }, (_, w) => ({ t: now - (W - 1 - w) * 7 * DAY, price: (i % 6 === 2 && w < 4) ? round5(p.price * 1.06) : p.price }));

    const f = { above: 0.87 + r() * 0.05, opp: 1.09 + r() * 0.06, comp: 0.992 + r() * 0.022, needs: 1 + (r() - 0.5) * 0.06 }[p.sc];
    let comps = COMPETITOR_SEED.map(c => c.id);
    if (p.sc !== 'needs' && r() < 0.4) comps.splice(Math.floor(r() * 4), 1);

    const add = (cid, opts = {}) => {
      const cmp = COMPETITOR_SEED.find(c => c.id === cid);
      const price = opts.price ?? round5(p.price * f * (1 + (r() - 0.5) * 0.07));
      const last = opts.last ?? (now - (1 + r() * 26) * HOUR);
      const inStock = opts.inStock ?? true;
      const m = {
        id: 'm' + (matches.length + 1), productId: p.id, compId: cid,
        title: opts.title ?? `${p.brand} ${p.name} ${p.model}`,
        url: `${cmp.website}/products/${slug(p.brand + '-' + p.model)}${opts.urlSuffix || ''}`,
        price, inStock, status: opts.status ?? 'approved', lastChecked: last,
        parseError: !!opts.parseError,
        signals: opts.signals ?? sigAll, score: opts.score ?? (92 + Math.floor(r() * 7)),
        createdAt: now - 60 * DAY, history: [],
      };
      m.history = opts.status === 'pending' ? [{ t: last, price, inStock }] : mkHistory(r, price ?? p.price, inStock, last, opts.forceDrop);
      if (m.parseError) { m.price = null; m.history[m.history.length - 1].price = null; }
      matches.push(m);
      return m;
    };

    if (p.sc === 'needs') {
      if (p.cat === 'safety' && i % 2 === 0) {
        // no matches at all
      } else if (p.cat === 'safety') {
        add('c2', { status: 'pending', score: 71, signals: { model: 'n', sku: 'u', brand: 'y', specs: 'y', pkg: 'y' }, title: `${p.brand} ${p.name}` });
      } else {
        add('c1');
        add('c3', { inStock: false });
        add('c4', { status: 'pending', score: 78, signals: { model: 'y', sku: 'u', brand: 'y', specs: 'y', pkg: 'n' }, title: `${p.brand} ${p.name} ${p.model} + شنطة وأقراص`, urlSuffix: '-kit' });
      }
      return;
    }
    comps.forEach((cid, k) => {
      const o = {};
      if (k === 0 && p.sc === 'above') o.forceDrop = true;
      if (k === 1 && i % 5 === 1) o.inStock = false;
      if (k === 2 && i % 7 === 3) o.last = now - 12 * DAY;              // stale observation
      if (k === 2 && i % 9 === 4) { o.price = round5(p.price * 0.42); o.title = `${p.brand} ${p.model} — قطعة غيار`; }   // outlier
      if (k === 0 && i % 8 === 6) o.parseError = true, o.price = null;  // scraper could not read the price
      add(cid, o);
    });
    // a pending (unconfirmed) listing for some products
    const missing = COMPETITOR_SEED.map(c => c.id).filter(c => !comps.includes(c));
    if (i % 3 === 0 && missing.length) {
      add(missing[0], { status: 'pending', score: 64 + Math.floor(r() * 20), price: round5(p.price * (0.85 + r() * 0.1)), signals: { model: r() < .5 ? 'y' : 'n', sku: 'u', brand: 'y', specs: r() < .6 ? 'y' : 'n', pkg: 'n' }, title: `${p.brand} ${p.name} (موديل ${p.model}-K مع ملحقات)`, urlSuffix: '-k' });
    }
  });

  // initial feed of recent market updates derived from the generated history
  const updates = [];
  matches.filter(m => m.status === 'approved').forEach(m => {
    const h = m.history, a = h[h.length - 2], b = h[h.length - 1];
    const p = products.find(x => x.id === m.productId), c = competitors.find(x => x.id === m.compId);
    if (a && b && a.price && b.price && a.price !== b.price) updates.push({ id: uid('u'), t: b.t, type: b.price < a.price ? 'down' : 'up', productId: p.id, text: `${c.name} ${b.price < a.price ? 'خفّض' : 'رفع'} سعر ${p.name} من ${egpTxt(a.price)} إلى ${egpTxt(b.price)}` });
    if (a && b && a.inStock && !b.inStock) updates.push({ id: uid('u'), t: b.t, type: 'stock', productId: p.id, text: `نفد مخزون ${p.name} لدى ${c.name}` });
  });
  updates.sort((x, y) => y.t - x.t);

  const analyzed = new Set(products.filter(p => matches.some(m => m.productId === p.id && m.status === 'approved')).map(p => p.id));
  return {
    products, competitors, matches, ourHistory, updates: updates.slice(0, 14),
    syncPool: RAW_SYNC_POOL.map((r, k) => buildProduct(r, RAW_PRODUCTS.length + k)),
    analyzed, lastSync: now - 26 * HOUR, lastAnalysis: now - 3 * HOUR, syncCount: 0,
  };
}

// ===================== pricing.js =====================
// Deterministic pricing intelligence. Pure functions — fixed formulas, no randomness.
// The same rules are meant to live in the .NET backend; the UI only displays results.
const STATUS = {
  competitive: { label: 'سعر تنافسي', cls: 'b-green', desc: 'سعرنا قريب من متوسط المنافسين — لا يحتاج تغييرًا', color: '#15803D' },
  above: { label: 'أعلى من السوق', cls: 'b-red', desc: 'سعرنا أغلى من متوسط المنافسين — يحتاج مراجعة', color: '#C62828' },
  opportunity: { label: 'فرصة لزيادة الربح', cls: 'b-blue', desc: 'سعرنا أرخص من المتوسط بوضوح — يمكن رفعه', color: '#1D4ED8' },
  needs: { label: 'بيانات غير كافية', cls: 'b-amber', desc: 'لا توجد أسعار منافسين كافية للحكم', color: '#B45309' },
};
const statusBadge = s => `<span class="badge ${STATUS[s].cls}">${STATUS[s].label}</span>`;

const Pricing = {
  profit: (price, cost) => price - cost,
  margin: (price, cost) => price > 0 ? (price - cost) / price * 100 : 0,
  /** Minimum Safe Price = Cost / (1 - Target Margin) */
  minSafe: (cost, targetPct) => cost / (1 - targetPct / 100),

  /** Classify one competitor observation. Only "ok" observations are used as market references. */
  assess(m, settings, now = Date.now()) {
    if (m.status === 'pending') return { ok: false, code: 'unconfirmed', reason: 'رابط لم يتم تأكيده' };
    if (m.status === 'rejected') return { ok: false, code: 'rejected', reason: 'رابط مرفوض' };
    if (m.parseError || m.price == null || !(m.price > 0)) return { ok: false, code: 'missing', reason: 'السعر غير متاح' };
    if (!m.inStock) return { ok: false, code: 'oos', reason: 'غير متوفر عند المنافس' };
    if (now - m.lastChecked > settings.staleDays * DAY) return { ok: false, code: 'stale', reason: `آخر تحديث أقدم من ${settings.staleDays} أيام` };
    return { ok: true, code: 'ok', reason: 'صالح للمقارنة' };
  },

  analyze(product, allMatches, settings) {
    const now = Date.now();
    const ms = allMatches.filter(m => m.productId === product.id && m.status !== 'rejected');
    const rows = ms.map(m => ({ m, ...Pricing.assess(m, settings, now) }));
    // outlier filter: a price far from the median of the other usable prices is unreliable
    let usable = rows.filter(r => r.ok);
    if (usable.length >= 3) {
      const med = median(usable.map(r => r.m.price));
      usable.forEach(r => { if (r.m.price < med * 0.6 || r.m.price > med * 1.6) Object.assign(r, { ok: false, code: 'outlier', reason: 'سعر غير منطقي مقارنة بالباقي' }); });
      usable = rows.filter(r => r.ok);
    }
    const prices = usable.map(r => r.m.price);
    const n = prices.length;
    const approved = ms.filter(m => m.status === 'approved');
    const res = {
      product, rows, n,
      approvedCount: approved.length,
      pendingCount: ms.filter(m => m.status === 'pending').length,
      inStockCount: approved.filter(m => m.inStock).length,
      excluded: rows.filter(r => !r.ok).length,
      lastChecked: approved.length ? Math.max(...approved.map(m => m.lastChecked)) : null,
      min: n ? Math.min(...prices) : null, max: n ? Math.max(...prices) : null, avg: n ? avg(prices) : null,
      minSafe: Pricing.minSafe(product.cost, settings.targetMargin),
      profitNow: Pricing.profit(product.price, product.cost),
      marginNow: Pricing.margin(product.price, product.cost),
      warnings: [],
    };
    res.diffPct = n ? (product.price - res.avg) / res.avg * 100 : null;
    if (res.marginNow < settings.targetMargin) res.warnings.push({ kind: 'warn', text: `هامش الربح الحالي (${isoPct(res.marginNow)}) أقل من الهامش المستهدف (${isoPct(settings.targetMargin, 0)}).`, sensitive: true });

    if (n < settings.minObservations) {
      res.status = 'needs';
      res.suggested = null;
      res.warnings.unshift({ kind: 'danger', text: `لا توجد أسعار منافسين كافية: الصالح للمقارنة ${n} من أصل ${rows.length}، والمطلوب ${settings.minObservations} على الأقل، لذلك لا يتم اقتراح سعر.` });
    } else {
      res.status = res.diffPct > settings.tolerance ? 'above' : res.diffPct < -settings.opportunityGap ? 'opportunity' : 'competitive';
      let s, basis;
      if (res.status === 'competitive') { s = product.price; basis = 'السعر الحالي مناسب للسوق'; }
      else {
        // Market reference: slightly under the competitors' average, never below the cheapest reliable competitor.
        s = round5(Math.max(res.avg * (1 - settings.undercut / 100), res.min));
        basis = `${100 - settings.undercut}% من متوسط المنافسين`;
      }
      res.floorHit = s < res.minSafe;
      if (res.floorHit) { s = ceil5(res.minSafe); basis = 'الحد الأدنى الآمن (مقرّبًا لأقرب 5 ج.م)'; }
      res.cannotCompete = res.minSafe > res.max;
      res.suggested = s; res.basis = basis;
      if (res.cannotCompete) res.warnings.unshift({ kind: 'danger', text: `حتى أغلى منافس (${egpTxt(res.max)}) أرخص من الحد الأدنى الآمن لسعرنا (${egpTxt(res.minSafe)}). تخفيض السعر لمجاراة السوق سيكسر هامش الربح — الأفضل مراجعة سعر الشراء مع المورد.`, sensitive: true });
      else if (res.floorHit) res.warnings.push({ kind: 'warn', text: 'السعر المقترح توقف عند الحد الأدنى الآمن حتى لا ينزل هامش الربح عن المستهدف.', sensitive: true });
      if (n === settings.minObservations) res.warnings.push({ kind: 'info', text: `النتيجة مبنية على ${cnt(n, 'price')} فقط — إضافة منافسين آخرين تجعلها أدق.` });
    }
    if (res.excluded) res.warnings.push({ kind: 'info', text: `تم تجاهل ${cnt(res.excluded, 'price')} في الحساب (رابط غير مؤكد، أو غير متوفر، أو قديم، أو سعر غير منطقي) — السبب موضح في الجدول.` });
    if (res.suggested != null) {
      res.profitSuggested = Pricing.profit(res.suggested, product.cost);
      res.marginSuggested = Pricing.margin(res.suggested, product.cost);
      res.deltaUnit = res.suggested - product.price;
    }
    return res;
  },
};

// Minimal, dependency-free .xlsx writer (stored ZIP + SpreadsheetML), RTL sheets.
const Xlsx = (() => {
  const enc = new TextEncoder();
  const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcTable[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const x = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  function zip(files) {
    const parts = [], central = []; let offset = 0;
    const d = new Date(), dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of files) {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
    const all = [...parts, ...central, new Uint8Array(e.buffer)];
    const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0)); let o = 0; for (const p of all) { out.set(p, o); o += p.length; }
    return out;
  }

  function sheetXml(rows, widths) {
    const cols = widths && widths.length ? `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    const body = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
      const ref = col(ci) + (ri + 1);
      if (v == null || v === '') return '';
      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${Number.isInteger(v) ? ' s="2"' : ' s="3"'}><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${ri === 0 ? ' s="1"' : ''}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${body}</sheetData></worksheet>`;
  }

  /** sheets: [{ name, rows: [[header...], [values...]], widths: [..] }] → Uint8Array (.xlsx) */
  function build(sheets) {
    const safe = s => s.replace(/[\[\]:*?/\\]/g, ' ').slice(0, 31);
    const files = [
      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },

// Save a generated file as a normal browser download.
// A hosting page may register its own saver with FileSaver.setHost({ save }) — optional.
const FileSaver = (() => {
  let host = null;
  async function save(filename, bytes) {
    if (host) {
      try { await host.save({ filename, data: bytes }); return 'saved'; }
      catch (e) { if (e && e.code === 'declined') return 'declined'; throw e; }
    }
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return 'saved';
  }
  return { save, setHost: h => { host = h; } };
})();

// ===================== api.js =====================
// Mock API layer. Every UI action goes through these functions only.
// To go live, replace each body with a fetch() to the ASP.NET Core API, e.g.
//   syncStore: () => fetch('/api/store/sync', { method: 'POST' }).then(r => r.json())
// The UI never touches mock data directly except through `db` reads returned here.
const db = buildMockDb();

const api = {
  /** POST /api/store/sync — read-only import from the Alkhalily Store API into the system DB */
  async syncStore() {
    await delay(500);
    const added = [];
    if (db.syncPool.length) { added.push(...db.syncPool.splice(0)); db.products.push(...added); }
    // simulate a few stock / price updates coming from the store
    const r = rng('sync-' + db.syncCount);
    const stockChanged = [];
    db.products.forEach(p => {
      if (r() < 0.08) { const old = p.stock; p.qty = old === 'out' ? 15 : Math.max(0, Math.round(p.qty * (0.3 + r() * 0.5))); p.stock = p.qty === 0 ? 'out' : p.qty < 8 ? 'low' : 'in'; if (p.stock !== old) stockChanged.push(p); }
    });
    db.syncCount++;
    db.lastSync = Date.now();
    added.forEach(p => db.ourHistory[p.id] = [{ t: Date.now(), price: p.price }]);
    db.updates.unshift({ id: uid('u'), t: Date.now(), type: 'sync', text: `مزامنة المتجر: ${cnt(db.products.length, 'product')}${added.length ? ` · الجديد: ${added.length}` : ''} · تحديثات المخزون: ${stockChanged.length}` });
    return { total: db.products.length, added, stockChanged, at: db.lastSync };
  },

  /** POST /api/competitors */
  async addCompetitor({ name, website }) {
    await delay(250);
    const colors = ['#0E7490', '#9333EA', '#B91C1C', '#4D7C0F', '#A16207'];
    const c = { id: uid('c'), name, website, color: colors[db.competitors.length % colors.length], addedAt: Date.now(), lastMonitor: null };
    db.competitors.push(c);
    db.updates.unshift({ id: uid('u'), t: Date.now(), type: 'comp', text: `تمت إضافة المنافس ${name}` });
    return c;
  },

  /** POST /api/competitors/preview — scraper reads a single URL (simulated) */
  async previewUrl(url, productId) {
    await delay(700);
    const p = db.products.find(x => x.id === productId);
    const r = rng(url + productId);
    return { title: p ? `${p.brand} ${p.name} ${p.model}` : 'منتج', price: p ? round5(p.price * (0.9 + r() * 0.18)) : null, inStock: r() > 0.15 };
  },

  /** POST /api/matches — manual link: always created as PENDING (needs human approval) */
  async addCompetitorUrl({ compId, productId, url, price, inStock, title }) {
    await delay(250);
    const p = db.products.find(x => x.id === productId);
    const m = { id: uid('m'), productId, compId, title: title || `${p.brand} ${p.name}`, url, price: price ?? null, inStock: inStock ?? true, status: 'pending', lastChecked: Date.now(), parseError: price == null, signals: { model: 'u', sku: 'u', brand: 'u', specs: 'u', pkg: 'u' }, score: null, createdAt: Date.now(), manual: true, history: [{ t: Date.now(), price: price ?? null, inStock: inStock ?? true }] };
    db.matches.push(m);
    return m;
  },

  /** PATCH /api/matches/:id { status } */
  async setMatchStatus(id, status) {
    await delay(150);
    const m = db.matches.find(x => x.id === id); if (!m) throw new Error('not found');
    m.status = status; m.reviewedAt = Date.now();
    if (status === 'approved') {
      if (m.history.length < 2 && m.price) { // seed a short history so charts are not empty
        m.history = [{ t: Date.now() - 7 * DAY, price: m.price, inStock: m.inStock }, ...m.history];
      }
      const p = db.products.find(x => x.id === m.productId), c = db.competitors.find(x => x.id === m.compId);
      db.updates.unshift({ id: uid('u'), t: Date.now(), type: 'match', productId: p.id, text: `تم تأكيد رابط ${p.name} عند ${c.name}` });
    }
    return m;
  },

  /** POST /api/discovery — search competitor stores for possible matches (simulated) */
  async discover(productId) {
    await delay(900);
    const p = db.products.find(x => x.id === productId);
    const r = rng('disc-' + productId);
    const out = [];
    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    db.competitors.forEach(c => {
      const existing = db.matches.find(m => m.productId === p.id && m.compId === c.id && !m.url.endsWith('-k') && !m.url.endsWith('-kit'));
      const base = round5(p.price * (0.9 + r() * 0.16));
      // 1) strong candidate (same model + brand)
      out.push({ key: c.id + '-exact', compId: c.id, existingId: existing?.id, title: `${p.brand} ${p.name} ${p.model}`, url: `${c.website}/products/${slug(p.brand + '-' + p.model)}`, price: existing?.price ?? base, inStock: existing ? existing.inStock : r() > 0.15, signals: { model: 'y', sku: 'u', brand: 'y', specs: 'y', pkg: 'y' }, score: 90 + Math.floor(r() * 9) });
      // 2) look-alike with different package contents
      if (r() < 0.55) out.push({ key: c.id + '-kit', compId: c.id, title: `${p.brand} ${p.name} ${p.model}-K + شنطة وملحقات`, url: `${c.website}/products/${slug(p.brand + '-' + p.model)}-kit`, price: round5(p.price * (1.08 + r() * 0.1)), inStock: true, signals: { model: 'n', sku: 'u', brand: 'y', specs: 'y', pkg: 'n' }, score: 55 + Math.floor(r() * 15) });
      // 3) other brand, similar specs
      if (r() < 0.35) { const ob = BRANDS.filter(b => b !== p.brand)[Math.floor(r() * 6)]; out.push({ key: c.id + '-alt', compId: c.id, title: `${ob} ${p.name}`, url: `${c.website}/products/${slug(ob)}-${Math.floor(r() * 9000 + 1000)}`, price: round5(p.price * (0.7 + r() * 0.2)), inStock: true, signals: { model: 'n', sku: 'u', brand: 'n', specs: 'y', pkg: 'u' }, score: 25 + Math.floor(r() * 15) }); }
    });
    out.sort((a, b) => b.score - a.score);
    return out;
  },

  /** Approve or reject a discovery candidate (creates the match record) */
  async reviewCandidate(productId, cand, status) {
    await delay(50);
    let m = cand.existingId ? db.matches.find(x => x.id === cand.existingId) : null;
    if (!m) {
      m = { id: uid('m'), productId, compId: cand.compId, title: cand.title, url: cand.url, price: cand.price, inStock: cand.inStock, status: 'pending', lastChecked: Date.now(), parseError: false, signals: cand.signals, score: cand.score, createdAt: Date.now(), history: [{ t: Date.now(), price: cand.price, inStock: cand.inStock }] };
      db.matches.push(m);
      cand.existingId = m.id;
    }
    return api.setMatchStatus(m.id, status);
  },

  /** POST /api/analysis/run — n8n would normally refresh approved URLs in the background */
  async runAnalysis(productIds, onStep) {
    const steps = 4;
    for (let s = 0; s < steps; s++) { onStep && onStep(s); await delay(520); }
    const now = Date.now();
    const r = rng('run-' + now);
    const changes = [];
    const ids = new Set(productIds);
    db.matches.filter(m => ids.has(m.productId) && m.status === 'approved').forEach(m => {
      const prev = m.price;
      if (m.parseError && r() < 0.5) { m.parseError = false; m.price = round5((db.products.find(p => p.id === m.productId).price) * (0.95 + r() * 0.08)); }
      else if (m.price && r() < 0.18) { m.price = round5(m.price * (1 + (r() < 0.6 ? -1 : 1) * (0.02 + r() * 0.05))); }
      if (r() < 0.04) m.inStock = !m.inStock;
      m.lastChecked = now;
      m.history.push({ t: now, price: m.price, inStock: m.inStock });
      if (prev && m.price && prev !== m.price) {
        const p = db.products.find(x => x.id === m.productId), c = db.competitors.find(x => x.id === m.compId);
        changes.push({ m, prev });
        db.updates.unshift({ id: uid('u'), t: now, type: m.price < prev ? 'down' : 'up', productId: p.id, text: `${c.name} ${m.price < prev ? 'خفّض' : 'رفع'} سعر ${p.name} من ${egpTxt(prev)} إلى ${egpTxt(m.price)}` });
      }
    });
    const touched = new Set(db.matches.filter(m => ids.has(m.productId) && m.status === 'approved').map(m => m.compId));
    db.competitors.forEach(c => { if (touched.has(c.id)) c.lastMonitor = now; });
    productIds.forEach(id => db.analyzed.add(id));
    db.lastAnalysis = now;
    db.updates.unshift({ id: uid('u'), t: now, type: 'analysis', text: `تحليل السوق: ${cnt(productIds.length, 'product')} · ${cnt(changes.length, 'change')} في أسعار المنافسين` });
    return { analyzed: productIds.length, changes };
  },
};

// Tiny SVG line chart drawn at real pixel size (ResizeObserver) with a hover tooltip.
const Charts = (() => {
  const registry = new Map();
  let ro = null;
  function niceTicks(min, max, n = 4) {
    const span = max - min || Math.abs(max) || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
    const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= step0) || mag * 10;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
    for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(6));
    return out;
  }
  function draw(el) {
    const cfg = registry.get(el.dataset.chart); if (!cfg) return;
    if (cfg.type === 'posmap') return drawPosmap(el, cfg);
    const svg = el.querySelector('svg'); const W = el.clientWidth, H = el.clientHeight; if (!W || !H) return;
    const small = W < 520;
    const pts = cfg.series.flatMap(s => s.points.filter(p => p.y != null));
    if (!pts.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="#9AA1AF" font-size="13">لا توجد بيانات كافية للرسم</text>`; return; }
    const pad = { l: small ? 44 : 58, r: 14, t: 12, b: 28 };
    let t0 = Math.min(...pts.map(p => p.t)), t1 = Math.max(...pts.map(p => p.t)); if (t0 === t1) { t0 -= DAY; t1 += DAY; }
    let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
    const yp = (y1 - y0) * 0.12 || y1 * 0.05 || 1; y0 -= yp; y1 += yp;
    const ticks = niceTicks(y0, y1, small ? 3 : 4); y0 = Math.min(y0, ticks[0]); y1 = Math.max(y1, ticks[ticks.length - 1]);
    const X = t => pad.l + (t - t0) / (t1 - t0) * (W - pad.l - pad.r);
    const Y = y => pad.t + (1 - (y - y0) / (y1 - y0)) * (H - pad.t - pad.b);
    const yfmt = cfg.yFormat || (v => fmt(v));
    let g = '';
    ticks.forEach(v => { if (v < y0 - 1e-9 || v > y1 + 1e-9) return; g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEF0F3"/><text x="${pad.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#9AA1AF">${esc(yfmt(v))}</text>`; });
    const xs = [...new Set(pts.map(p => p.t))].sort((a, b) => a - b);
    const every = Math.max(1, Math.ceil(xs.length / (small ? 4 : 8)));
    xs.forEach((t, i) => { if (i % every && i !== xs.length - 1) return; const d = new Date(t); g += `<text x="${X(t)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#9AA1AF">${d.getDate()}/${d.getMonth() + 1}</text>`; });
    if (cfg.refLine != null && cfg.refLine >= y0 && cfg.refLine <= y1) g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(cfg.refLine)}" y2="${Y(cfg.refLine)}" stroke="#C62828" stroke-dasharray="3 4" opacity=".6"/><text x="${W - pad.r}" y="${Y(cfg.refLine) - 5}" text-anchor="end" font-size="11" fill="#C62828" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(cfg.refLabel || '')}</text>`;
    cfg.series.forEach((s, si) => {
      const ps = s.points.filter(p => p.y != null); if (!ps.length) return;
      const d = ps.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
      if (s.area) {
        const gid = `g${el.dataset.chart.replace(/[^a-z0-9]/gi, '')}${si}`;
        g += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".18"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>`;
        g += `<path d="${d}L${X(ps[ps.length - 1].t).toFixed(1)},${H - pad.b}L${X(ps[0].t).toFixed(1)},${H - pad.b}Z" fill="url(#${gid})"/>`;
      }
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dashed ? 'stroke-dasharray="6 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
      ps.forEach(p => g += `<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="${ps.length > 12 ? 0 : 2.6}" fill="#fff" stroke="${s.color}" stroke-width="1.6"/>`);
    });
    g += `<circle class="hov" r="5" fill="#fff" stroke-width="2.4" style="display:none"/>`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;
    const tip = el.querySelector('.tip'), hov = svg.querySelector('.hov');
    const all = cfg.series.flatMap(s => s.points.filter(p => p.y != null).map(p => ({ s, p, x: X(p.t), y: Y(p.y) })));
    svg.onmousemove = e => {
      const b = svg.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
      let best = null, bd = 1e9; all.forEach(a => { const d = (a.x - mx) ** 2 + ((a.y - my) ** 2) * 0.3; if (d < bd) { bd = d; best = a; } });
      if (!best || bd > 2500) { tip.style.display = 'none'; hov.style.display = 'none'; return; }
      hov.style.display = ''; hov.setAttribute('cx', best.x); hov.setAttribute('cy', best.y); hov.setAttribute('stroke', best.s.color);
      tip.style.display = 'block'; tip.style.left = best.x + 'px'; tip.style.top = best.y + 'px';
      tip.innerHTML = `<b>${esc(best.s.name)}</b><br>${fmtDate(best.p.t)} · ${esc(yfmt(best.p.y))}${best.p.note ? ' · ' + esc(best.p.note) : ''}`;
    };
    svg.onmouseleave = () => { tip.style.display = 'none'; hov.style.display = 'none'; };
  }
  // "Price position map": every product as a dot by its % difference from the competitors' average.
  function drawPosmap(el, cfg) {
    const svg = el.querySelector('svg'), W = el.clientWidth, H = el.clientHeight; if (!W || !H) return;
    const small = W < 560, pts = cfg.points;
    const L = Math.ceil((Math.max(15, ...pts.map(p => Math.abs(p.x))) + 2) / 5) * 5;
    const pad = { l: 14, r: 14, t: 34, b: 46 };
    const X = v => pad.l + (Math.max(-L, Math.min(L, v)) + L) / (2 * L) * (W - pad.l - pad.r);
    const top = pad.t, bot = H - pad.b, midY = (top + bot) / 2;
    const zones = [
      { a: -L, b: -cfg.gap, fill: '#EEF3FF', c: '#1D4ED8', t: small ? 'أرخص' : 'أرخص من السوق — فرصة لزيادة الربح' },
      { a: -cfg.gap, b: cfg.tol, fill: '#E9F9EF', c: '#15803D', t: small ? 'تنافسي' : 'سعر تنافسي' },
      { a: cfg.tol, b: L, fill: '#FDEDED', c: '#C62828', t: small ? 'أغلى' : 'أغلى من السوق' },
    ];
    let g = '';
    zones.forEach(z => { g += `<rect x="${X(z.a)}" y="${top}" width="${X(z.b) - X(z.a)}" height="${bot - top}" fill="${z.fill}"/><text x="${(X(z.a) + X(z.b)) / 2}" y="${top - 12}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${z.c}">${z.t}</text>`; });
    g += `<line x1="${X(0)}" x2="${X(0)}" y1="${top - 4}" y2="${bot + 4}" stroke="#1D2230" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/>`;
    const step = L >= 30 ? 10 : 5;
    for (let v = -L; v <= L; v += step) { if (small && v % 10) continue; g += `<line x1="${X(v)}" x2="${X(v)}" y1="${bot}" y2="${bot + 5}" stroke="#C9CDD6"/><text x="${X(v)}" y="${bot + 18}" text-anchor="middle" font-size="11" fill="#6B7385">${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)}%</text>`; }
    g += `<text x="${X(0)}" y="${H - 6}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1D2230">متوسط المنافسين</text>`;
    g += `<text x="${pad.l}" y="${H - 6}" text-anchor="start" font-size="11.5" fill="#1D4ED8">← أرخص</text><text x="${W - pad.r}" y="${H - 6}" text-anchor="end" font-size="11.5" fill="#C62828">أغلى →</text>`;
    // beeswarm: keep dots from overlapping
    const r = small ? 6.5 : 8, d = r * 2 + 2, placed = [];
    [...pts].sort((a, b) => a.x - b.x).forEach(p => {
      const cx = X(p.x); let cy = midY;
      for (let k = 0; k < 40; k++) {
        const off = k === 0 ? 0 : Math.ceil(k / 2) * (r * 1.15) * (k % 2 ? -1 : 1);
        const y = midY + off;
        if (y < top + r || y > bot - r) continue;
        if (placed.every(q => (q.cx - cx) ** 2 + (q.cy - y) ** 2 >= d * d)) { cy = y; break; }
      }
      placed.push({ cx, cy, p });
    });
    placed.forEach(({ cx, cy, p }) => { g += `<circle data-act="openP" data-id="${esc(p.id)}" data-tab="market" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${p.color}" fill-opacity=".88" stroke="#fff" stroke-width="1.6" style="cursor:pointer"/>`; });
    g += `<circle class="hov" r="${r + 3}" fill="none" stroke-width="2.4" style="display:none;pointer-events:none"/>`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
    const tip = el.querySelector('.tip'), hov = svg.querySelector('.hov');
    svg.onmousemove = e => {
      const b = svg.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
      const hit = placed.find(q => (q.cx - mx) ** 2 + (q.cy - my) ** 2 <= (r + 3) ** 2);
      if (!hit) { tip.style.display = 'none'; hov.style.display = 'none'; return; }

        </div></div>`;

    place();
    requestAnimationFrame(place);

  }
  function place() {
    if (i < 0) return;
    const s = steps[i], card = root().querySelector('.tour-card'), spot = root().querySelector('.tour-spot');
    if (!card) return;
    const vw = window.innerWidth, vh = window.innerHeight, m = 12;
    const cw = card.offsetWidth, ch = card.offsetHeight;
    const t = s.sel && document.querySelector(s.sel);
    if (!t || s.final) { card.style.left = Math.max(m, (vw - cw) / 2) + 'px'; card.style.top = Math.max(m, (vh - ch) / 2) + 'px'; return; }
    const r = t.getBoundingClientRect(), p = 8;
    const sx = Math.max(4, r.left - p), sy = Math.max(4, r.top - p);
    const sw = Math.min(vw - 4, r.right + p) - sx, sh = Math.min(vh - 4, r.bottom + p) - sy;

})();

// ---------- analysis cache ----------
function analyses() {
  const map = new Map();

// ---------- selection model ----------
function selResolve(sel = state.sel) {
  let base;
  if (sel.all) base = db.products.slice();
  else {
    const hc = sel.cats.length, hb = sel.brands.length;
    base = db.products.filter(p => {
      let g = false;
      if (hc && hb) g = sel.combine === 'and' ? (sel.cats.includes(p.cat) && sel.brands.includes(p.brand)) : (sel.cats.includes(p.cat) || sel.brands.includes(p.brand));
      else if (hc) g = sel.cats.includes(p.cat);
      else if (hb) g = sel.brands.includes(p.brand);
      return g || sel.products.includes(p.id);
    });
  }
  if (sel.rule === 'lowMargin') base = base.filter(p => Pricing.margin(p.price, p.cost) < state.settings.targetMargin);
  return base.filter(p => !sel.exCats.includes(p.cat) && !sel.exBrands.includes(p.brand) && !sel.exProducts.includes(p.id));
}
const selEmpty = (s = state.sel) => !s.all && !s.cats.length && !s.brands.length && !s.products.length && !s.rule;
function selDescribe(s = state.sel) {
  if (selEmpty(s) && !s.exCats.length && !s.exBrands.length && !s.exProducts.length) return 'لم يتم اختيار منتجات بعد';
  const parts = [];
  if (s.all) parts.push('كل المنتجات');
  if (s.cats.length) parts.push('الفئات: ' + s.cats.map(c => CAT[c].name).join('، '));
  if (s.brands.length) parts.push('العلامات: ' + s.brands.join('، '));
  if (s.cats.length && s.brands.length) parts.push(s.combine === 'and' ? '(الفئة والعلامة معًا)' : '(الفئة أو العلامة)');
  if (s.products.length) parts.push(`منتجات محددة: ${s.products.length}`);
  if (s.rule === 'lowMargin') parts.push('بشرط: هامش أقل من المستهدف');
  const ex = [...s.exCats.map(c => CAT[c].name), ...s.exBrands, ...(s.exProducts.length ? [cnt(s.exProducts.length, 'product')] : [])];
  if (ex.length) parts.push('باستثناء: ' + ex.join('، '));
  return parts.join(' · ');
}
const pull = (arr, v) => { const i = arr.indexOf(v); if (i > -1) arr.splice(i, 1); };
function cycleFacet(kind, v) {
  const s = state.sel, inc = kind === 'cat' ? s.cats : s.brands, exc = kind === 'cat' ? s.exCats : s.exBrands;
  if (inc.includes(v)) { pull(inc, v); exc.push(v); }
  else if (exc.includes(v)) pull(exc, v);
  else if (s.all) exc.push(v);
  else inc.push(v);
}
function toggleProduct(id) {

}

// ===================== A. DASHBOARD =====================
function marketTrend(cat) {
  const now = Date.now(), B = 8;
  const bucketOf = t => Math.min(B - 1, Math.max(0, Math.floor((now - t) / (7 * DAY))));
  const prods = [...db.analyzed].map(P).filter(p => p && (!cat || p.cat === cat));
  const mkt = Array.from({ length: B }, () => []), our = Array.from({ length: B }, () => []);
  prods.forEach(p => {
    const ms = db.matches.filter(m => m.productId === p.id && m.status === 'approved');
    const per = Array.from({ length: B }, () => []);
    ms.forEach(m => { const last = {}; m.history.forEach(h => { if (h.price) last[bucketOf(h.t)] = h.price; }); Object.entries(last).forEach(([b, v]) => per[b].push(v)); });
    const cur = avg(per[0]);
    if (cur) per.forEach((arr, b) => { if (arr.length) mkt[b].push(avg(arr) / cur * 100); });
    const oh = db.ourHistory[p.id] || []; const ol = {}; oh.forEach(h => ol[bucketOf(h.t)] = h.price);
    if (ol[0]) Object.entries(ol).forEach(([b, v]) => our[b].push(v / ol[0] * 100));
  });
  const pts = arr => arr.map((v, b) => ({ t: now - b * 7 * DAY, y: v.length ? avg(v) : null })).reverse();
  return { market: pts(mkt), ours: pts(our), n: prods.length };
}
function computeAlerts(A) {
  const out = [], analyzed = [...db.analyzed].map(id => A.get(id)).filter(Boolean);
  const hi = analyzed.filter(a => a.status === 'above' && a.diffPct > 8).sort((x, y) => y.diffPct - x.diffPct);
  hi.slice(0, 3).forEach(a => out.push({ key: 'above-' + a.product.id, sev: 'danger', text: `${a.product.name}: أغلى من متوسط المنافسين بنسبة ${isoPct(a.diffPct)}`, meta: `سعرنا ${egpTxt(a.product.price)} · متوسط المنافسين ${egpTxt(a.avg)}`, product: a.product.id }));
  const floor = isAdmin() ? analyzed.filter(a => a.cannotCompete) : [];
  floor.slice(0, 2).forEach(a => out.push({ key: 'floor-' + a.product.id, sev: 'warn', text: `${a.product.name}: لا يمكن مجاراة المنافسين دون خسارة الهامش`, meta: 'حتى أغلى منافس أرخص من الحد الأدنى الآمن — راجع سعر الشراء مع المورد', product: a.product.id }));
  if (floor.length > 2) out.push({ key: 'floor-more-' + floor.length, sev: 'warn', text: `منتجات أخرى (${floor.length - 2}) لا يمكن مجاراة سعرها دون خسارة الهامش`, meta: 'اعرضها في تحليل السوق', goStatus: 'above' });
  if (hi.length > 3) out.push({ key: 'above-more-' + hi.length, sev: 'danger', text: `منتجات أخرى (${hi.length - 3}) أغلى من المنافسين بأكثر من ${isoPct(8, 0)}`, meta: 'اعرضها في تحليل السوق', goStatus: 'above' });
  const pend = db.matches.filter(m => m.status === 'pending').length;
  if (pend) out.push({ key: 'pending-' + pend, sev: 'info', text: `${cnt(pend, 'link')} بانتظار تأكيدك`, meta: 'الروابط غير المؤكدة لا تدخل في المقارنة', go: 'competitors' });

      ${dp ? `<div class="note info" style="margin-top:14px">${ic('info', 'stroke="currentColor"')}<div><b>منتجنا:</b> ${esc(dp.name)} · الموديل <span class="mono ltr">${esc(dp.model)}</span> · <span class="ltr">${esc(dp.brand)}</span><br><span class="small">المواصفات: ${esc(dp.specs)} · محتويات العبوة: ${esc(dp.pkg)}</span></div></div>` : ''}
      ${d.loading ? `<div class="empty"><span class="spin"></span><div style="margin-top:8px">جارٍ البحث عند ${cnt(db.competitors.length, 'competitor')}…</div></div>` : ''}
      ${!d.loading && d.results ? `<div class="small muted" style="margin:14px 0 8px">${cnt(d.results.length, 'result')} محتملة — مرتبة من الأكثر تشابهًا. راجع <b>الموديل ومحتويات العبوة</b> قبل التأكيد. الروابط التي أكدتها من قبل تظهر بعلامة «مؤكد».</div>${d.results.length ? d.results.map(c => {
        const m = c.existingId ? db.matches.find(x => x.id === c.existingId) : null, st = m ? m.status : null, comp = C(c.compId);
        const scoreCol = c.score >= 85 ? 'var(--green)' : c.score >= 55 ? 'var(--amber)' : 'var(--red)';
        const scoreTxt = c.score >= 85 ? 'تشابه عالٍ' : c.score >= 55 ? 'تشابه متوسط' : 'تشابه ضعيف';
        return `<div class="cand ${st || ''}"><div><div class="c-t">${esc(c.title)}</div><div class="c-m"><b>${esc(comp.name)}</b><span>${egp(c.price)}</span><span>${c.inStock ? 'متوفر' : 'غير متوفر'}</span><a class="ltr" href="${safeUrl(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.url.replace(/^https?:\/\//, ''))}</a></div><div style="margin-top:6px">${signalsHtml(c.signals)}</div></div>
        <div class="c-a"><span class="small" style="color:${scoreCol}"><b class="score">${c.score}%</b> ${scoreTxt}</span>${st ? matchBadge(st) : ''}
        ${st === 'approved' || st === 'rejected' ? `<button class="btn sm" data-act="candReview" data-key="${c.key}" data-s="pending">${ic('undo')} تراجع</button>` : `<button class="btn sm ok" data-act="candReview" data-key="${c.key}" data-s="approved">${ic('check')} نفس المنتج</button><button class="btn sm no" data-act="candReview" data-key="${c.key}" data-s="rejected">${ic('x')} منتج مختلف</button>`}</div></div>`;
      }).join('') : '<div class="empty">لم يتم العثور على نتائج</div>'}
      <div class="legend-tiny"><span>✓ متطابق</span><span>✗ مختلف</span><span>؟ غير متاح للمقارنة (المنافسون لا يعرضون كود SKU الخاص بنا)</span></div>` : ''}
      ${!d.loading && !d.results && !dp ? '<div class="empty" style="padding:22px"><b>ابدأ بكتابة اسم منتج أو رقم موديل</b>يقارن النظام: رقم الموديل، والعلامة التجارية، والمواصفات، ومحتويات العبوة</div>' : ''}
    </div>`;
  } else {
    const list = db.matches.filter(m => !cs.compId || m.compId === cs.compId);
    const nTab = s => list.filter(m => m.status === s).length;
    const shown = list.filter(m => m.status === cs.tab).sort((a, b) => b.lastChecked - a.lastChecked);
    const tabs = [['pending', 'بانتظار تأكيدك'], ['approved', 'مؤكدة'], ['rejected', 'مرفوضة']];
    body = `<div class="card-b" style="border-bottom:1px solid var(--line-2)">
      <div class="note info">${ic('info', 'stroke="currentColor"')}<div><b>المطلوب منك:</b> افتح كل رابط وتأكد أنه <b>نفس المنتج تمامًا</b> (نفس الموديل ونفس محتويات العبوة). اختر «نفس المنتج» لاستخدام سعره في المقارنة، أو «منتج مختلف» لاستبعاده.</div></div>
      <div class="toolbar" style="margin-top:12px"><div class="seg" role="tablist">${tabs.map(([k, l]) => `<button class="${cs.tab === k ? 'on' : ''}" data-act="compTab" data-v="${k}">${l} (${nTab(k)})</button>`).join('')}</div><span style="flex:1"></span>
      <select class="select" style="width:auto" data-ch="compFilter" aria-label="المنافس"><option value="">كل المنافسين</option>${db.competitors.map(c => `<option value="${c.id}" ${cs.compId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div></div>
    <div class="tbl-wrap"><table class="tbl compact stick1"><thead><tr><th>منتجنا</th><th>المنافس</th><th>المنتج عند المنافس</th><th class="n">سعره</th><th>متوفر؟</th><th>ما الذي يتطابق؟</th><th>آخر تحديث</th><th>قرارك</th></tr></thead><tbody>
    ${shown.length ? shown.map(m => { const p = P(m.productId), c = C(m.compId); return `<tr>
      <td><div class="p-cell">${productImage(p)}<div><div class="p-name clickable" data-act="openP" data-id="${p.id}" data-tab="market">${esc(p.name)}</div><div class="p-sub mono ltr">${esc(p.model)}</div></div></div></td>
      <td class="nowrap">${esc(c.name)}</td>
      <td style="min-width:170px;max-width:240px"><div>${esc(m.title)}</div><a class="small" href="${safeUrl(m.url)}" target="_blank" rel="noopener noreferrer">${ic('ext', 'width="12" height="12" stroke="currentColor"')} فتح الرابط (تجريبي)</a>${m.manual ? ' <span class="badge b-gray plain small">أضيف يدويًا</span>' : ''}</td>
      <td class="n">${m.price ? egp(m.price) : '<span class="badge b-amber plain">السعر غير متاح</span>'}</td>
      <td>${m.inStock ? '<span class="badge b-green">متوفر</span>' : '<span class="badge b-red">غير متوفر</span>'}</td>
      <td>${signalsHtml(m.signals)}${m.score ? `<div class="small muted" style="margin-top:3px">نسبة التشابه ${m.score}%</div>` : '<div class="small muted" style="margin-top:3px">راجع الرابط بنفسك</div>'}</td>
      <td class="nowrap small">${relTime(m.lastChecked)}</td>
      <td class="nowrap"><div class="decide">${m.status === 'pending' ? `<button class="btn sm ok" data-act="setMatch" data-id="${m.id}" data-s="approved">${ic('check')} نفس المنتج</button><button class="btn sm no" data-act="setMatch" data-id="${m.id}" data-s="rejected">${ic('x')} منتج مختلف</button>` : m.status === 'approved' ? `<button class="btn sm" data-act="setMatch" data-id="${m.id}" data-s="pending">إلغاء التأكيد</button>` : `<button class="btn sm" data-act="setMatch" data-id="${m.id}" data-s="pending">${ic('undo')} إعادة للمراجعة</button>`}</div></td></tr>`; }).join('') : `<tr><td colspan="8"><div class="empty"><b>${cs.tab === 'pending' ? 'لا توجد روابط تنتظر تأكيدك' : cs.tab === 'approved' ? 'لا توجد روابط مؤكدة' : 'لا توجد روابط مرفوضة'}</b>${cs.tab === 'pending' ? 'يمكنك البحث عن روابط جديدة من تبويب «البحث عن منتج عند المنافسين»' : ''}</div></td></tr>`}
    </tbody></table></div>`;
  }
  return head + body + '</div>';
}

// ===================== D. MARKET ANALYSIS =====================
function scopeIds(scope) {
  if (scope === 'selection') return selResolve().map(p => p.id);
  if (scope === 'all') return db.products.map(p => p.id);
  return [...db.analyzed];
}
function viewAnalysis() {
  const A = analyses(), f = state.ana;
  const ids = scopeIds(f.scope);
  const base = ids.map(id => A.get(id)).filter(Boolean);
  const list = base.filter(a => (!f.status || a.status === f.status) && (!f.cat || a.product.cat === f.cat) && matchesQ(a.product, f.q));
  const order = { above: 0, opportunity: 1, competitive: 2, needs: 3 };
  list.sort(f.sort === 'name' ? (a, b) => a.product.name.localeCompare(b.product.name, 'ar') : f.sort === 'status' ? (a, b) => order[a.status] - order[b.status] : (a, b) => (b.diffPct ?? -999) - (a.diffPct ?? -999));
  const nStatus = s => base.filter(a => !s || a.status === s).length;
  const selN = selResolve().length;
  const adm = isAdmin();
  return `
  <div class="card">
    <div class="card-h"><div><h2>مقارنة أسعارنا بالمنافسين</h2><div class="sub">آخر تحليل ${relTime(db.lastAnalysis)} · اضغط على أي منتج لعرض التفاصيل${adm ? ' والسعر المقترح' : ''}</div></div>
      <div class="actions">
        <select class="select" style="width:auto" data-ch="anaScope" aria-label="نطاق التحليل"><option value="analyzed" ${f.scope === 'analyzed' ? 'selected' : ''}>المنتجات التي تم تحليلها (${db.analyzed.size})</option><option value="selection" ${f.scope === 'selection' ? 'selected' : ''} ${selN ? '' : 'disabled'}>الاختيار الحالي (${selN})</option><option value="all" ${f.scope === 'all' ? 'selected' : ''}>كل المنتجات (${db.products.length})</option></select>
        ${adm ? `<label class="small muted nowrap" for="tm" title="أقل نسبة ربح مقبولة — لا يقترح النظام سعرًا يقل عنها">هامش الربح المستهدف</label><input id="tm" class="input num" type="number" min="1" max="60" step="1" value="${state.settings.targetMargin}" data-ch="margin" style="width:76px"> <span class="small muted">%</span>` : ''}
        <button class="btn primary" data-act="runAnalysis" ${ids.length ? '' : 'disabled'}>${ic('play')} تحديث التحليل (${cnt(ids.length, 'product')})</button>
      </div></div>
    <div class="card-b" style="border-bottom:1px solid var(--line-2)">
      <div class="chips" id="status-filter" style="margin-bottom:12px">${[['', 'الكل'], ...['above', 'competitive', 'opportunity', 'needs'].map(k => [k, STATUS[k].label])].map(([k, l]) => `<button class="chip filter ${f.status === k ? 'on' : ''}" data-act="anaStatus" data-v="${k}" ${k ? `title="${STATUS[k].desc}"` : ''}>${k ? `<span style="width:8px;height:8px;border-radius:50%;background:${STATUS[k].color}"></span>` : ''}${l} <span class="c-n">${nStatus(k)}</span></button>`).join('')}</div>
      <div class="toolbar"><div class="search">${ic('search')}<input id="ana-q" class="input" placeholder="ابحث بالاسم أو الموديل أو SKU" value="${esc(f.q)}" data-in="anaQ" autocomplete="off"></div>
        <select class="select" data-ch="anaCat" aria-label="الفئة"><option value="">كل الفئات</option>${CATEGORIES.map(c => `<option value="${c.id}" ${f.cat === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
    </div>
    <div class="tbl-wrap"><table class="tbl compact stick1"><thead><tr><th>المنتج</th><th>النتيجة</th><th class="n">سعرنا</th>${adm ? '<th class="n">التكلفة</th>' : ''}<th class="n" title="أرخص وأغلى سعر صالح للمقارنة">أسعار المنافسين</th><th class="n">متوسطهم</th><th class="n" title="الفرق بين سعرنا ومتوسط المنافسين">الفرق</th><th>توفر المنافسين · آخر تحديث</th>${adm ? '<th class="n">السعر المقترح</th>' : ''}</tr></thead><tbody>
    ${list.length ? list.map(a => { const p = a.product; return `<tr class="clickable" data-act="openP" data-id="${p.id}" data-tab="market">
      <td><div class="p-cell">${productImage(p)}<div><div class="p-name">${esc(p.name)}</div><div class="p-sub"><span class="mono ltr">${esc(p.model)}</span> · <span class="ltr">${esc(p.brand)}</span>${db.analyzed.has(p.id) ? '' : ' · <span class="badge b-gray plain small">لم يُحلل</span>'}</div></div></div></td>
      <td>${statusBadge(a.status)}</td>
      <td class="n"><b>${egp(p.price)}</b></td>${adm ? `<td class="n muted">${egp(p.cost)}</td>` : ''}
      <td class="n">${a.n ? `<span class="num">${fmt(a.min)} – ${fmt(a.max)}</span>` : '<span class="muted">—</span>'}</td><td class="n">${egp(a.avg)}</td>
      <td class="n" style="color:${a.diffPct > state.settings.tolerance ? 'var(--red)' : a.diffPct < -state.settings.opportunityGap ? 'var(--blue)' : 'inherit'}">${pct(a.diffPct)}</td>
      <td class="nowrap small">${a.approvedCount ? `متوفر عند ${a.inStockCount} من ${a.approvedCount}` : '<span class="muted">لا توجد روابط مؤكدة</span>'}<div class="muted">${a.lastChecked ? relTime(a.lastChecked) : '—'}</div></td>
      ${adm ? `<td class="n">${a.suggested != null ? `<b>${egp(a.suggested)}</b>${a.deltaUnit ? `<div class="small ${a.deltaUnit > 0 ? '' : 'muted'}" style="color:${a.deltaUnit > 0 ? 'var(--green)' : ''}">${a.deltaUnit > 0 ? 'رفع' : 'خفض'} <span class="num">${fmt(Math.abs(a.deltaUnit))}</span></div>` : '<div class="small muted">اترك السعر كما هو</div>'}${a.floorHit ? '<div class="small nowrap" style="color:var(--amber)" title="لا يمكن النزول أكثر دون خسارة هامش الربح المستهدف">عند الحد الآمن</div>' : ''}` : '<span class="muted">—</span>'}</td>` : ''}
</tr>`; }).join('') : `<tr><td colspan="12"><div class="empty"><b>لا توجد منتجات</b>${f.scope === 'selection' ? 'اختر منتجات من صفحة المنتجات' : 'جرّب تغيير الفلاتر'}</div></td></tr>`}
    </tbody></table></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-b small" style="line-height:1.9"><details class="how"><summary>كيف يتم حساب النتائج؟</summary><div class="muted" style="margin-top:8px">
    <div>• الحساب ثابت وقابل للمراجعة — لا توجد أسعار يولّدها الذكاء الاصطناعي.</div>
    <div>• نقارن سعرنا بـ<b>متوسط أسعار المنافسين الصالحة للمقارنة</b> فقط. يتم تجاهل: الروابط غير المؤكدة، والمنتجات غير المتوفرة عند المنافس، والأسعار غير المتاحة، والأسعار الأقدم من ${state.settings.staleDays} أيام، والأسعار غير المنطقية مقارنة بالباقي.</div>
    <div>• <b>أعلى من السوق</b>: سعرنا أغلى من المتوسط بأكثر من ${state.settings.tolerance}% · <b>سعر تنافسي</b>: بين +${state.settings.tolerance}% و −${state.settings.opportunityGap}% · <b>فرصة لزيادة الربح</b>: أرخص من المتوسط بأكثر من ${state.settings.opportunityGap}% · <b>بيانات غير كافية</b>: عدد الأسعار الصالحة أقل من ${state.settings.minObservations}.</div>
    ${adm ? `<div>• <b>السعر المقترح</b>: المنتج ذو السعر التنافسي يبقى على سعره. غير ذلك = ${100 - state.settings.undercut}% من متوسط المنافسين، ولا يقل عن أرخص منافس، ولا ينزل أبدًا عن <b>الحد الأدنى الآمن = التكلفة ÷ (1 − ${state.settings.targetMargin}%)</b>، ويُقرّب لأقرب 5 ج.م.</div>` : ''}
    <div>• النظام يقترح فقط ولا يغيّر أي سعر في المتجر.</div></div></details></div></div>`;
}

// ---------- product detail (modal) ----------

  const tab = m.tab || 'market';
  const head = `<div class="detail-head">${productImage(p, 'lg')}<div><h3>${esc(p.name)}</h3><div class="meta-line"><span>SKU <b class="mono ltr">${esc(p.sku)}</b></span><span>الموديل <b class="mono ltr">${esc(p.model)}</b></span><span>العلامة <b class="ltr">${esc(p.brand)}</b></span><span>الفئة <b>${CAT[p.cat].name}</b></span></div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${statusBadge(a.status)} ${stockBadge(p)} ${db.analyzed.has(p.id) ? '' : '<span class="badge b-gray plain">لم يُحلل بعد</span>'}</div></div></div>`;
  const tabs = `<div class="tabs" style="padding:0;margin-top:14px">${[['market', 'مقارنة الأسعار'], ['info', 'بيانات المنتج']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="pTab" data-v="${k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (tab === 'info') {
    const inSel = selResolve().some(x => x.id === p.id);
    body = `<div class="grid g-2e" style="margin-top:16px">
      <div><dl class="kv"><dt>سعر البيع</dt><dd>${egp(p.price)}</dd>${adm ? `<dt>سعر التكلفة</dt><dd>${egp(p.cost)}</dd><dt>الربح للوحدة</dt><dd>${egp(a.profitNow)}</dd><dt>هامش الربح</dt><dd>${pctPlain(a.marginNow)}</dd>` : ''}<dt>الكمية بالمخزون</dt><dd class="num">${p.qty}</dd><dt>المواصفات</dt><dd style="white-space:normal;font-weight:500">${esc(p.specs)}</dd><dt>محتويات العبوة</dt><dd style="white-space:normal;font-weight:500">${esc(p.pkg)}</dd></dl>
      ${adm ? '' : `<div class="note lock" style="margin-top:12px">${ic('lock', 'stroke="currentColor"')}<div>التكلفة وهامش الربح متاحان لمدير التسعير فقط.</div></div>`}</div>
      <div><div class="sec-title" style="margin-top:0">روابط المنافسين لهذا المنتج</div>
      <div class="list">${db.matches.filter(x => x.productId === p.id).map(x => `<div class="li" style="padding:8px 0"><div><div class="t">${esc(C(x.compId).name)}</div><div class="m">${x.price ? egpTxt(x.price) : 'سعر غير مقروء'} · ${x.inStock ? 'متوفر' : 'غير متوفر'}</div></div><div class="act">${matchBadge(x.status)}</div></div>`).join('') || '<div class="small muted">لا توجد روابط منافسين بعد.</div>'}</div>
