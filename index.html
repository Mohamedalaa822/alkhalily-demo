// ---------- plain-language verdict shown at the top of a product's analysis ----------
function verdictHtml(a, adm) {
  const p = a.product, st = STATUS[a.status];
  const bg = { above: 'var(--red-50)', competitive: 'var(--green-50)', opportunity: 'var(--blue-50)', needs: 'var(--amber-50)' }[a.status];
  const icon = { above: 'trendUp', competitive: 'check', opportunity: 'tag', needs: 'alert' }[a.status];
  const sugg = () => {
    const s = a.suggested, pr = p.price;
    if (s === pr) return ' نقترح إبقاء السعر كما هو.';
    if (s > pr) return a.floorHit ? ` هامش ربحنا الحالي أقل من المستهدف، لذلك نقترح ${egpTxt(s)} حفاظًا على الهامش.${a.cannotCompete ? ' المنافسة بالسعر هنا غير مربحة — الأفضل مراجعة سعر الشراء مع المورد.' : ''}` : ` نقترح رفعه إلى ${egpTxt(s)}، أي ربح إضافي ${egpTxt(s - pr)} في كل قطعة، وسنظل أرخص من متوسط المنافسين.`;
    return a.cannotCompete ? ` أقل سعر ممكن مع الحفاظ على هامش الربح هو ${egpTxt(s)}، وسيظل أغلى من المنافسين — الأفضل مراجعة سعر الشراء مع المورد.` : ` نقترح تخفيضه إلى ${egpTxt(s)}.`;
  };
  let title, text;
  if (a.status === 'needs') {
    title = 'لا يمكن الحكم على السعر الآن';
    text = `عدد الأسعار الصالحة للمقارنة ${a.n} فقط، والمطلوب ${state.settings.minObservations} على الأقل. ابحث عن المنتج عند المنافسين وأكّد الروابط الصحيحة ثم حدّث التحليل.`;
  } else {
    const d = isoPct(Math.abs(a.diffPct));
    if (a.status === 'above') { title = 'سعرنا أغلى من المنافسين'; text = `سعرنا ${egpTxt(p.price)} أعلى من متوسط المنافسين (${egpTxt(a.avg)}) بنسبة ${d}.`; }
    else if (a.status === 'opportunity') { title = 'فرصة لزيادة الربح'; text = `سعرنا ${egpTxt(p.price)} أرخص من متوسط المنافسين (${egpTxt(a.avg)}) بنسبة ${d}.`; }
    else { title = 'سعرنا مناسب'; text = `سعرنا ${egpTxt(p.price)} قريب من متوسط المنافسين (${egpTxt(a.avg)})، الفرق ${d} فقط.`; }
    text += adm ? sugg() : (a.status === 'competitive' ? ' لا يحتاج تغييرًا.' : ' يُنصح بمراجعته مع مدير التسعير.');
  }
  return `<div class="verdict" style="background:${bg};border-color:${st.color}33">${ic(icon, `width="22" height="22" stroke="${st.color}" style="flex:none;margin-top:2px"`)}<div><b class="v-t" style="color:${st.color}">${title}</b>${esc(text)}</div></div>`;
}

  const col = (h, v, o = {}) => ({ h, v, ...o });
  const money = (h, v, o) => col(h, v, { money: true, w: 14, ...o });
  const base = [pc, col('SKU', a => a.product.sku, { mono: true, w: 16, noScreen: true }), col('العلامة', a => a.product.brand, { w: 10 }), money('سعرنا', a => a.product.price), money('متوسط المنافسين', a => a.avg == null ? null : Math.round(a.avg)), money('أرخص منافس', a => a.min), col('الفرق %', a => a.diffPct == null ? null : +a.diffPct.toFixed(1), { pct: true, w: 10 })];
  const sens = [money('التكلفة', a => a.product.cost, { sensitive: true }), col('الهامش %', a => +a.marginNow.toFixed(1), { pct0: true, sensitive: true, w: 14 }), money('السعر المقترح', a => a.suggested, { sensitive: true })];
  const changes = [];
  db.matches.filter(m => m.status === 'approved').forEach(m => { const h = m.history.filter(x => x.price); for (let i = h.length - 1; i > 0 && Date.now() - h[i].t < 5 * DAY; i--) { if (h[i].price !== h[i - 1].price) { changes.push({ m, p: P(m.productId), c: C(m.compId), from: h[i - 1].price, to: h[i].price, t: h[i].t }); break; } } });
  changes.sort((a, b) => b.t - a.t);

    { id: 'changes', title: 'تغيرات أسعار المنافسين', desc: 'آخر تغيير سعر لكل رابط منافس مؤكد خلال آخر 5 أيام', rows: changes, cols: [

function render() {

  if (fid) { const el = document.getElementById(fid); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); if (s0 && s0[0] != null) try { el.setSelectionRange(s0[0], s0[1]); } catch (e) { } } }
}
function toast(text, kind = 'ok') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status'); t.textContent = text;
  document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 3600);
}
function go(route) { const changed = state.route !== route; state.route = route; try { history.replaceState(null, '', '#' + route); } catch (e) { } window.scrollTo(0, 0); render(); if (changed) { const v = document.getElementById('view'); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); } }
const openModal = m => { state.modal = m; render(); if (m.type === 'product' || m.type === 'guide') return; const el = document.querySelector('#modal-root input:not([type=checkbox]),#modal-root select'); if (el && !document.querySelector('#modal-root').contains(document.activeElement)) el.focus(); };
const closeModal = () => { state.modal = null; render(); };

// ---------- long-running simulated actions ----------
async function doSync() {
  if (state.modal && state.modal.type === 'progress' && !state.modal.done) return;
  const m = { type: 'progress', title: 'مزامنة المتجر (محاكاة)', steps: ['الاتصال بـ Alkhalily Store API (قراءة فقط)', 'جلب المنتجات والأسعار والمخزون', 'حفظ البيانات في قاعدة بيانات النظام المستقلة'], cur: 0, note: 'لا يتم تعديل أي بيانات في المتجر.' };
  openModal(m);
  for (let i = 0; i < m.steps.length - 1; i++) { await delay(450); m.cur = i + 1; render(); }
  const r = await api.syncStore();
  m.done = true;
  m.result = `<div class="note info">${ic('check', 'stroke="currentColor"')}<div><b>تمت المزامنة بنجاح</b> · ${cnt(r.total, 'product')} في النظام<br>${r.added.length ? `منتجات جديدة: ${r.added.map(p => esc(p.name)).join('، ')}` : 'لا توجد منتجات جديدة'} · تحديثات مخزون: ${r.stockChanged.length}</div></div>`;
  if (r.added.length) m.footer = `<button class="btn" data-act="goNew">عرض المنتجات الجديدة</button>`;
  render();
}
async function doAnalysis(ids) {
  if (!ids.length) return toast('لا توجد منتجات للتحليل', 'err');
  const m = { type: 'progress', title: 'تحديث تحليل السوق (محاكاة)', steps: [`تجميع المنتجات المختارة (${ids.length})`, 'جلب أحدث الأسعار من روابط المنافسين المؤكدة', 'تجاهل الأسعار غير الصالحة للمقارنة', 'حساب السعر المقترح دون النزول عن الحد الأدنى الآمن'], cur: 0, note: 'في النظام الفعلي يتم التحديث في الخلفية عبر n8n وخدمة جمع البيانات.' };
  openModal(m);
  const r = await api.runAnalysis(ids, s => { m.cur = s; render(); });
  const A = analyses(), res = ids.map(id => A.get(id));
  const c = s => res.filter(a => a.status === s).length;
  m.done = true;
  m.result = `<div class="stats">${['competitive', 'above', 'opportunity', 'needs'].map(s => `<div class="stat"><div class="s-l">${STATUS[s].label}</div><div class="s-v" style="color:${STATUS[s].color}">${c(s)}</div></div>`).join('')}</div>
    <div class="small muted" style="margin-top:12px">تم تحليل ${cnt(r.analyzed, 'product')} · ${cnt(r.changes.length, 'change')} في أسعار المنافسين منذ آخر تحديث${r.changes.length ? ': ' + r.changes.slice(0, 3).map(x => `${esc(P(x.m.productId).name)} (${esc(C(x.m.compId).name)}: ${fmt(x.prev)} ← ${fmt(x.m.price)})`).join('، ') : ''}</div>`;
  m.footer = state.route !== 'analysis' ? `<button class="btn" data-act="go" data-v="analysis">عرض النتائج</button>` : '';
  render();
}

  // analysis
  anaStatus: el => { state.ana.status = el.dataset.v; render(); },
  runAnalysis: () => doAnalysis(scopeIds(state.ana.scope)),
  copyPrice: async el => { try { await navigator.clipboard.writeText(el.dataset.v); toast('تم نسخ السعر المقترح', 'ok'); } catch (e) { toast(`السعر المقترح: ${fmt(+el.dataset.v)} ج.م`, 'info'); } },
  // reports
  repTab: el => { state.rep.tab = el.dataset.v; render(); },
  export: el => exportReports(el.dataset.v),
  confirmYes: () => { const f = state.modal.onYes; state.modal = null; f && f(); render(); },
  reset: () => openModal({ type: 'confirm', title: 'إعادة ضبط البيانات التجريبية', text: 'سيتم إعادة تحميل الصفحة واستعادة البيانات التجريبية الأصلية وحذف المجموعات المحفوظة.', yes: 'إعادة الضبط', onYes: () => { ['groups', 'role', 'margin', 'seenGuide', 'seenIntro'].forEach(k => { try { LS && LS.removeItem('alk-mi-' + k); } catch (e) { } }); location.reload(); } }),
};
function closeModalSilently() { state.modal = null; }
function closeCover() { if (state.cover) { state.cover = false; saveLS('seenIntro', true); } }
async function runDiscovery(pid) {
  const p = P(pid);
  Object.assign(state.disc, { productId: pid, q: p.model, picking: false, loading: true, results: null });
  render();
  const res = await api.discover(pid);
  if (state.disc.productId !== pid) return;
  Object.assign(state.disc, { loading: false, results: res });
  render();
}
const inputs = {
  catQ: v => state.cat.q = v, anaQ: v => state.ana.q = v,
  discQ: v => { state.disc.q = v; state.disc.picking = true; },
  whatIf: v => state.modal.whatIf = v,
  mf: (v, el) => { const k = el.dataset.k; state.modal[k] = k === 'price' ? (v === '' ? null : Number(v)) : k === 'inStock' ? v === '1' : v; state.modal.err = null; },
};
const changes = {
  catCat: v => state.cat.cat = v, catBrand: v => state.cat.brand = v, catStock: v => state.cat.stock = v,
  anaCat: v => state.ana.cat = v, anaSort: v => state.ana.sort = v, anaScope: v => state.ana.scope = v,
  dashCat: v => state.dash.cat = v, compFilter: v => state.comp.compId = v,
  margin: v => { const n = Math.min(60, Math.max(1, Math.round(Number(v) || 20))); state.settings.targetMargin = n; saveLS('margin', n); toast(`الهامش المستهدف: ${n}% — تمت إعادة الحساب`, 'info'); },
  mf: inputs.mf,
};
const forms = {
  addComp: async () => {
    const m = state.modal, name = (m.name || '').trim(), w = (m.website || '').trim();
    if (!name) { m.err = 'أدخل اسم المتجر'; return render(); }
    let url; try { url = new URL(/^https?:\/\//i.test(w) ? w : 'https://' + w); } catch (e) { }
    if (!url || !url.hostname.includes('.')) { m.err = 'أدخل رابط موقع صحيح'; return render(); }
    if (db.competitors.some(c => new URL(c.website).host === url.host)) { m.err = 'هذا المنافس مضاف بالفعل'; return render(); }
    const c = await api.addCompetitor({ name, website: url.origin });
    state.modal = null; render(); toast(`تمت إضافة ${c.name}`, 'ok');
  },
  addUrl: async () => {
    const m = state.modal;
    if (!m.productId) { m.err = 'اختر منتج الخليلي المرتبط'; return render(); }
    if (!/^https?:\/\/[^\s/]+\.[^\s]+/i.test(m.url || '')) { m.err = 'أدخل رابطًا صحيحًا يبدأ بـ https://'; return render(); }
    if (db.matches.some(x => x.url === m.url && x.productId === m.productId)) { m.err = 'هذا الرابط مرتبط بالمنتج بالفعل'; return render(); }
    await api.addCompetitorUrl({ compId: m.compId, productId: m.productId, url: m.url, price: m.price, inStock: m.inStock, title: m.title });
    state.modal = null; state.comp.tab = 'pending'; state.comp.section = 'review'; if (state.route !== 'competitors') go('competitors'); else render();
    toast('تم حفظ الرابط — أكّده من «مراجعة الروابط» ليدخل في المقارنة', 'ok');
  },
  saveGroup: () => {
    const m = state.modal, name = (m.name || '').trim();
    if (!name) { m.err = 'أدخل اسمًا للمجموعة'; return render(); }
    if (state.groups.some(g => g.name === name)) { m.err = 'يوجد مجموعة بنفس الاسم'; return render(); }
    state.groups.push({ id: uid('g'), name, sel: clone(state.sel) }); saveLS('groups', state.groups);
    state.modal = null; render(); toast(`تم حفظ المجموعة «${name}»`, 'ok');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') return;
  if (el.dataset.act === 'overlay' && e.target !== el) return; // clicks inside a modal body: let forms/inputs behave natively
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (el.type !== 'checkbox') e.preventDefault();
  if (el.disabled) return;
  fn(el, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (!el) return; inputs[el.dataset.in]?.(el.value, el); render(); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (!el) return; changes[el.dataset.ch]?.(el.value, el); render(); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); forms[f.dataset.form]?.(); });
document.addEventListener('keydown', e => {
  if (Tour.active) {
    if (e.key === 'Escape') { e.preventDefault(); Tour.end(); }
    else if (e.key === 'ArrowLeft' || (e.key === 'Enter' && !e.target.closest('.tour-card button'))) { e.preventDefault(); Tour.next(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); Tour.prev(); }
    return;
  }
  if (e.key === 'Escape' && state.cover) { closeCover(); render(); return; }
  if (e.key === 'Escape' && state.modal && !(state.modal.type === 'progress' && !state.modal.done)) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (ROUTES.includes(r) && r !== state.route) { state.route = r; render(); } });
setInterval(() => { if (!state.modal) renderTopbar(); }, 60e3);
document.getElementById('nojs')?.remove();
render();

}
</script>
</body>
</html>
